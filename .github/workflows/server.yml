name: Server (Supabase)

# Veröffentlicht die Edge Functions, wenn sich supabase/ ändert.
# Voraussetzungen: Secret SUPABASE_ACCESS_TOKEN, Variable SUPABASE_PROJECT_REF.

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Edge Functions veröffentlichen
        run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --use-api
